<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Assistant Axis Token Viewer</title>
  <style>
    :root{color-scheme:light dark;--bg:light-dark(#f7f7f5,#141516);--panel:light-dark(#fff,#1d1f21);--text:light-dark(#1d2023,#f2f3f4);--muted:light-dark(#6f7479,#a8adb2);--border:light-dark(#d9dcdf,#393d41);--blue:light-dark(#2877c7,#78b7f0);--orange:light-dark(#b85d14,#f2a45f);--green:light-dark(#287a4b,#68c48f);--purple:light-dark(#7554b3,#ac91e4);--red:light-dark(#a53d45,#ef7d84);--shadow:0 10px 35px light-dark(#1b252f12,#0006)}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden}button,select,input{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-columns:255px minmax(0,1fr)}
    aside{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-height:0}.brand{padding:18px 16px 12px}.brand h1{font-size:16px;margin:0 0 3px}.brand p{margin:0;color:var(--muted);font-size:12px}.filters{padding:0 12px 10px;display:grid;gap:8px}.filters input,.filters select,.toolbar select{width:100%;border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:7px 8px}.pair-list{overflow:auto;border-top:1px solid var(--border);padding:6px}.pair{width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:7px;display:grid;grid-template-columns:42px 1fr;gap:7px}.pair:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}.pair.active{background:color-mix(in srgb,var(--blue) 14%,transparent)}.pair .num{font-variant-numeric:tabular-nums;color:var(--muted)}.pair .meta{min-width:0}.pair .category{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pair .result{font-size:11px;color:var(--muted);text-transform:capitalize}.pair .result.successful{color:var(--red)}
    main{min-width:0;overflow:auto;padding:18px 22px 26px}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}.title h2{font-size:19px;margin:0 0 4px}.title .meta{color:var(--muted);font-size:12px}.segmented{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}.segmented button{border:0;border-right:1px solid var(--border);background:transparent;padding:7px 12px}.segmented button:last-child{border-right:0}.segmented button[aria-pressed=true]{background:color-mix(in srgb,var(--blue) 16%,transparent);font-weight:650}
    .toolbar{display:grid;grid-template-columns:190px 160px 110px 190px auto;gap:10px;align-items:end;margin-bottom:10px}.control label{display:block;color:var(--muted);font-size:11px;margin:0 0 3px}.pager{display:flex;gap:6px;justify-content:flex-end}.pager button{border:1px solid var(--border);background:var(--panel);border-radius:7px;padding:7px 10px}.pager button:disabled{opacity:.35;cursor:default}.chart-wrap{position:relative;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);min-height:360px}.chart{width:100%;height:360px;display:block}.chart text{fill:var(--text);font-size:11px}.chart .grid{stroke:var(--border);stroke-opacity:.55}.chart .frame{fill:none;stroke:var(--border)}.chart .line{fill:none;stroke:var(--blue);stroke-width:1.75;vector-effect:non-scaling-stroke}.chart .zero{stroke:var(--muted);stroke-dasharray:4 4}.chart .boundary{stroke-width:1.2;stroke-dasharray:3 3}.chart .selection{stroke:var(--text);fill:var(--panel);stroke-width:1.5}.tooltip{display:none;position:absolute;pointer-events:none;z-index:4;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);padding:8px 10px;max-width:300px;font-size:12px}.tooltip strong{display:block;margin-bottom:3px}.legend{display:flex;gap:13px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.key{display:flex;align-items:center;gap:5px}.dash{width:15px;border-top:2px dashed var(--blue)}
    .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;margin-top:14px}.tokens-panel,.detail{background:var(--panel);border:1px solid var(--border)}.section-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}.section-head h3{font-size:13px;margin:0}.section-head span{color:var(--muted);font-size:11px}.tokens{padding:12px;max-height:270px;overflow:auto;font:12px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}.tok{display:inline;border:0;border-bottom:3px solid transparent;background:transparent;padding:2px 1px;margin:0;border-radius:2px;white-space:pre-wrap}.tok:hover,.tok.selected{outline:1px solid var(--text);outline-offset:1px}.tok.structural{opacity:.62}.tok.prompt{background:color-mix(in srgb,var(--purple) 6%,transparent)}.tok.generated{background:color-mix(in srgb,var(--green) 6%,transparent)}.detail dl{margin:0;padding:10px 12px;display:grid;grid-template-columns:92px 1fr;gap:7px 10px}.detail dt{color:var(--muted)}.detail dd{margin:0;min-width:0;word-break:break-word;font-variant-numeric:tabular-nums}.token-piece{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.empty{height:70vh;display:grid;place-items:center;color:var(--muted)}
    @media(max-width:900px){.app{grid-template-columns:205px minmax(0,1fr)}.toolbar{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.detail{order:-1}}@media(max-width:650px){body{overflow:auto}.app{height:auto;display:block}aside{height:260px;border-right:0;border-bottom:1px solid var(--border)}main{padding:14px}.topline{display:block}.segmented{margin-top:10px}.toolbar{grid-template-columns:1fr}.chart-wrap,.chart{min-height:300px;height:300px}}
  </style>
</head>
<body>
<div class="app">
  <aside><div class="brand"><h1>Assistant Axis</h1><p>Token-level projection explorer</p></div><div class="filters"><input id="search" type="search" placeholder="Filter category or pair…" aria-label="Filter pairs"><select id="resultFilter" aria-label="Filter outcome"><option value="all">All outcomes</option><option value="successful">Successful attacks</option><option value="unchanged">Unchanged attacks</option><option value="unlabeled">Unlabeled</option></select></div><div id="pairList" class="pair-list" aria-label="Response pairs"></div></aside>
  <main><div id="empty" class="empty">Loading encrypted response index…</div><div id="viewer" hidden>
    <div class="topline"><div class="title"><h2 id="pairTitle">Pair</h2><div class="meta" id="pairMeta"></div></div><div class="segmented" aria-label="Condition"><button data-condition="attack" aria-pressed="true">Attack</button><button data-condition="baseline" aria-pressed="false">Baseline</button></div></div>
    <div class="toolbar"><div class="control"><label for="coordinate">Activation coordinate</label><select id="coordinate"><option value="block_output_layer_16">Layer 16 · block output</option><option value="pre_mlp_layer_16">Layer 16 · pre-MLP</option><option value="block_output_layer_18">Layer 18 · block output</option><option value="pre_mlp_layer_18">Layer 18 · pre-MLP</option></select></div><div class="control"><label for="axis">Projection</label><select id="axis"><option value="z_axis">Raw Assistant Axis</option><option value="z_residual">Role-residualized axis</option></select></div><div class="control"><label for="windowSize">Tokens shown</label><select id="windowSize"><option>64</option><option selected>128</option><option>256</option><option>512</option><option value="all">All</option></select></div><div class="control"><label for="jump">Jump to event</label><select id="jump"></select></div><div class="pager"><button id="prev" type="button">← Earlier</button><button id="next" type="button">Later →</button></div></div>
    <div class="chart-wrap"><svg id="chart" class="chart" role="img" aria-label="Assistant Axis projection by token"></svg><div id="tooltip" class="tooltip" role="tooltip"></div><div id="legend" class="legend"></div></div>
    <div class="detail-grid"><section class="tokens-panel"><div class="section-head"><h3>Tokens in current window</h3><span>Click a token or point to inspect it</span></div><div id="tokens" class="tokens"></div></section><section class="detail"><div class="section-head"><h3>Selected token</h3><span id="selectedIndex"></span></div><dl id="details"></dl></section></div>
  </div></main>
</div>
<script>
(() => {
  const key=new URLSearchParams(location.search).get('key'), api=path=>fetch(`${path}${path.includes('?')?'&':'?'}key=${encodeURIComponent(key)}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`Request failed: ${r.status}`);return r.json()}), $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const state={pairs:[],filtered:[],pair:null,ordinal:1,condition:'attack',coordinate:'block_output_layer_16',axis:'z_axis',start:0,size:128,selected:0};
  const colors={generation:'var(--green)',request:'var(--red)','request-end':'var(--red)',forgery:'var(--orange)',analysis:'var(--purple)',final:'var(--blue)'};
  const esc=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), visibleResponse=()=>state.pair.responses[state.condition], values=()=>visibleResponse().coordinates[state.coordinate][state.axis], labelPiece=text=>text.replace(/ /g,'·').replace(/\n/g,'↵\n').replace(/\t/g,'⇥'), outcomeText=v=>v==='successful'?'successful attack':v==='unchanged'?'unchanged / safe':'unlabeled pair';
  function renderList(){const q=$('#search').value.trim().toLowerCase(),rf=$('#resultFilter').value;state.filtered=state.pairs.filter(p=>(rf==='all'||p.result===rf)&&(!q||`${p.ordinal} ${p.category} ${p.result}`.toLowerCase().includes(q)));$('#pairList').innerHTML=state.filtered.map(p=>`<button class="pair ${p.ordinal===state.ordinal?'active':''}" data-ordinal="${p.ordinal}"><span class="num">#${String(p.ordinal).padStart(3,'0')}</span><span class="meta"><span class="category">${esc(p.category)}</span><span class="result ${p.result}">${esc(outcomeText(p.result))}</span></span></button>`).join('');$$('.pair').forEach(b=>b.onclick=()=>loadPair(Number(b.dataset.ordinal)));}
  async function loadPair(ordinal){state.ordinal=ordinal;state.pair=await api(`/api/pair?ordinal=${ordinal}`);state.start=0;state.selected=0;$('#empty').hidden=true;$('#viewer').hidden=false;renderList();render();}
  function clampWindow(){const n=values().length;if(state.size==='all')state.start=0;else state.start=Math.max(0,Math.min(state.start,Math.max(0,n-state.size)));state.selected=Math.max(0,Math.min(state.selected,n-1));}
  function windowRange(){const n=values().length;return state.size==='all'?[0,n]:[state.start,Math.min(n,state.start+state.size)]}
  function render(){clampWindow();const r=visibleResponse(),[a,b]=windowRange();$('#pairTitle').textContent=`Pair ${String(state.pair.ordinal).padStart(3,'0')}`;$('#pairMeta').textContent=`${state.pair.category} · ${outcomeText(state.pair.result)} · ${r.tokens.length.toLocaleString()} tokens · ${r.finish_reason}${r.hit_token_limit?' · token cap':''}`;$$('.segmented button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.condition===state.condition));$('#jump').innerHTML='<option value="">Choose an event…</option><option value="0">sequence begins · 0</option>'+r.markers.map(mark=>`<option value="${mark.index}">${esc(mark.label)} · ${mark.index}</option>`).join('');$('#prev').disabled=a===0;$('#next').disabled=b===r.tokens.length||state.size==='all';renderChart(a,b);renderTokens(a,b);renderDetails();}
  function renderChart(a,b){const svg=$('#chart'),r=visibleResponse(),vals=values(),slice=vals.slice(a,b),rect=svg.getBoundingClientRect(),W=Math.max(520,Math.round(rect.width||900)),H=360,m={l:62,r:18,t:58,b:47},w=W-m.l-m.r,h=H-m.t-m.b;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML='';const lo=Math.min(0,...slice),hi=Math.max(0,...slice),pad=Math.max(.25,(hi-lo)*.08),y0=lo-pad,y1=hi+pad,x=i=>m.l+(i-a)/Math.max(1,b-a-1)*w,y=v=>m.t+(y1-v)/(y1-y0)*h,ns='http://www.w3.org/2000/svg',add=(tag,attrs={},text='')=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.appendChild(e);return e};for(let j=0;j<=5;j++){const v=y0+(y1-y0)*j/5,yy=y(v);add('line',{x1:m.l,x2:m.l+w,y1:yy,y2:yy,class:'grid'});add('text',{x:m.l-8,y:yy+4,'text-anchor':'end'},v.toFixed(1))}add('rect',{x:m.l,y:m.t,width:w,height:h,class:'frame'});if(y0<=0&&y1>=0)add('line',{x1:m.l,x2:m.l+w,y1:y(0),y2:y(0),class:'zero'});const ticks=Math.min(6,b-a);for(let j=0;j<ticks;j++){const idx=Math.round(a+(b-a-1)*j/Math.max(1,ticks-1));add('text',{x:x(idx),y:H-24,'text-anchor':j===0?'start':j===ticks-1?'end':'middle'},String(idx))}const activeMarkers=r.markers.filter(mark=>mark.index>=a&&mark.index<b);activeMarkers.forEach((mark,j)=>{const xx=x(mark.index),right=xx>m.l+w*.76;add('line',{x1:xx,x2:xx,y1:m.t,y2:m.t+h,class:'boundary',stroke:colors[mark.kind]||'var(--muted)'});add('text',{x:right?xx-4:xx+4,y:14+(j%3)*15,'text-anchor':right?'end':'start',fill:colors[mark.kind]||'var(--text)'},mark.label)});let d='';for(let i=a;i<b;i++)d+=`${i===a?'M':'L'}${x(i).toFixed(2)},${y(vals[i]).toFixed(2)}`;add('path',{d,class:'line'});if(state.selected>=a&&state.selected<b)add('circle',{cx:x(state.selected),cy:y(vals[state.selected]),r:4.5,class:'selection'});add('text',{x:m.l+w/2,y:H-4,'text-anchor':'middle'},'Absolute token index');add('text',{x:14,y:m.t+h/2,transform:`rotate(-90 14 ${m.t+h/2})`,'text-anchor':'middle'},'Projection (default-Assistant SD)');const hit=add('rect',{x:m.l,y:m.t,width:w,height:h,fill:'transparent'});hit.style.cursor='crosshair';hit.addEventListener('mousemove',ev=>{const box=svg.getBoundingClientRect(),px=(ev.clientX-box.left)*W/box.width,idx=Math.max(a,Math.min(b-1,Math.round(a+(px-m.l)/w*(b-a-1))));showTip(ev,idx)});hit.addEventListener('mouseleave',()=>$('#tooltip').style.display='none');hit.addEventListener('click',ev=>{const box=svg.getBoundingClientRect(),px=(ev.clientX-box.left)*W/box.width;state.selected=Math.max(a,Math.min(b-1,Math.round(a+(px-m.l)/w*(b-a-1))));render()});$('#legend').innerHTML=activeMarkers.map(mark=>`<span class="key"><span class="dash" style="border-color:${colors[mark.kind]||'var(--muted)'}"></span>${esc(mark.label)} · ${mark.index}</span>`).join('')||'<span>No semantic boundary in this window</span>';}
  function showTip(ev,idx){const r=visibleResponse(),t=r.tokens[idx],v=values()[idx],tip=$('#tooltip'),wrap=$('.chart-wrap').getBoundingClientRect();tip.innerHTML=`<strong>Token ${idx} · ${v.toFixed(3)} SD</strong><span class="token-piece">${esc(labelPiece(t.text)||'∅')}</span><br>${esc(t.generated?'generated':'prompt')} · ${esc(t.role||'structural')}`;tip.style.display='block';tip.style.left=`${Math.min(wrap.width-310,Math.max(8,ev.clientX-wrap.left+12))}px`;tip.style.top=`${Math.max(8,ev.clientY-wrap.top-10)}px`;}
  function projectionColor(v,max){const alpha=.18+.62*Math.min(1,Math.abs(v)/max);return v<0?`color-mix(in srgb,var(--orange) ${alpha*100}%,transparent)`:`color-mix(in srgb,var(--blue) ${alpha*100}%,transparent)`}
  function renderTokens(a,b){const r=visibleResponse(),vals=values(),max=Math.max(1,...vals.slice(a,b).map(Math.abs));$('#tokens').innerHTML=r.tokens.slice(a,b).map((t,j)=>{const i=a+j,cls=[t.generated?'generated':'prompt',t.content?'':'structural',i===state.selected?'selected':''].join(' ');return `<button class="tok ${cls}" data-index="${i}" title="token ${i} · ${vals[i].toFixed(3)} SD" style="border-bottom-color:${projectionColor(vals[i],max)}">${esc(labelPiece(t.text)||'∅')}</button>`}).join('');$$('.tok').forEach(t=>t.onclick=()=>{state.selected=Number(t.dataset.index);render();requestAnimationFrame(()=>document.querySelector('.tok.selected')?.scrollIntoView({block:'nearest'}))});}
  function renderDetails(){const r=visibleResponse(),t=r.tokens[state.selected],coords=r.coordinates,rows=[['Piece',`<span class="token-piece">${esc(labelPiece(t.text)||'∅')}</span>`],['Token index',t.index],['Token ID',t.id],['Phase',t.generated?'generated':'prompt'],['Harmony role',t.role||'structural'],['Content token',t.content?'yes':'no'],['Raw axis',Number(coords[state.coordinate].z_axis[t.index]).toFixed(4)+' SD'],['Residual axis',Number(coords[state.coordinate].z_residual[t.index]).toFixed(4)+' SD']];$('#selectedIndex').textContent=`#${t.index}`;$('#details').innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');}
  $$('.segmented button').forEach(b=>b.onclick=()=>{state.condition=b.dataset.condition;state.start=0;state.selected=0;render()});$('#coordinate').onchange=e=>{state.coordinate=e.target.value;render()};$('#axis').onchange=e=>{state.axis=e.target.value;render()};$('#windowSize').onchange=e=>{state.size=e.target.value==='all'?'all':Number(e.target.value);state.start=Math.floor(state.selected-(state.size==='all'?0:state.size/2));render()};$('#jump').onchange=e=>{if(e.target.value==='')return;state.selected=Number(e.target.value);state.start=state.size==='all'?0:Math.floor(state.selected-state.size/2);render()};$('#prev').onclick=()=>{state.start-=state.size;state.selected=Math.max(0,state.start);render()};$('#next').onclick=()=>{state.start+=state.size;state.selected=state.start;render()};$('#search').oninput=renderList;$('#resultFilter').onchange=renderList;window.addEventListener('resize',()=>state.pair&&renderChart(...windowRange()));api('/api/index').then(data=>{state.pairs=data.pairs;renderList();return loadPair(1)}).catch(()=>{$('#empty').textContent='The private viewer server is unavailable. Start it with: python3 scripts/serve_projection_viewer.py — then use the local URL it prints, rather than opening this HTML file directly.'});
})();
</script>
</body>
</html>
